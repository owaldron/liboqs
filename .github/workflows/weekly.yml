name: Weekly tests

permissions:
  contents: read

on:
  schedule:
    - cron: "5 0 * * 0"
  push:
    branches:
      - demo/create-issue-on-weekly-fail

jobs:

  # To guarantee Maintained check is occasionally updated. See
  # https://github.com/ossf/scorecard/blob/main/docs/checks.md#maintained
  scorecard:
    if: github.event_name != 'push'
    uses: ./.github/workflows/supplychain.yml
    secrets: inherit
    permissions:
      id-token: write
      security-events: write
      contents: read

  extended-tests:
    if: github.event_name != 'push'
    uses: ./.github/workflows/extended.yml

  kem-continuous-benchmarking:
    if: github.event_name != 'push'
    uses: ./.github/workflows/kem-bench.yml
    permissions:
      contents: write
    
  sig-continuous-benchmarking:
    if: github.event_name != 'push'
    uses: ./.github/workflows/sig-bench.yml
    permissions:
      contents: write

  ct-tooling:
    if: github.event_name != 'push'
    uses: ./.github/workflows/ct-tooling.yml
    permissions:
      contents: read
    with:
      algorithms: 'ML-KEM-512,ML-KEM-768,ML-KEM-1024'

  demo-failure:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Fail quickly to demonstrate issue creation
        run: exit 1

  report-failure:
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs:
      - scorecard
      - extended-tests
      - kem-continuous-benchmarking
      - sig-continuous-benchmarking
      - ct-tooling
      - demo-failure
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open issue for failed weekly tests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_jobs=$(printf '%s' "$NEEDS" | jq -r \
            'to_entries[] | select(.value.result == "failure") | .key')

          gh issue create \
            --title "Weekly tests failed (run #${GITHUB_RUN_NUMBER})" \
            --body "$(cat <<EOF
          The weekly workflow failed. Please review the failure and investigate.

          Failed jobs:
          $(printf '%s\n' "$failed_jobs" | sed 's/^/- /')

          Workflow run: $RUN_URL
          EOF
          )"